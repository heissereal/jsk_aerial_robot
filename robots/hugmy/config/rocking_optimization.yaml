optimization:
  trial_launch: rocking_optimization_trial.launch
  required_phases: [19, 20, 21, 22, 23, 24]
  trials: 32
  initial_random_trials: 8
  domain_samples: 3
  seed: 11
  candidate_pool_size: 4096
  episode_timeout_sim_sec: 60.0
  startup_timeout_wall_sec: 30.0
  direction_xy: [1.0, 0.0]
  command_distance_m: 0.003
  # A gait is successful only when forward displacement remains after all
  # four arms have regripped.  Candidate ranking uses the worst randomized
  # domain instead of allowing a good domain to hide a backward one.
  minimum_completed_progress_m: 0.0005
  reward_aggregation: worst
  result_directory: /tmp/hugmy_rocking_optimization

  parameters:
    base_pressure_kpa:        {min: 24.0, max: 38.0}
    rear_release_kpa:         {min: 0.0,  max: 10.0}
    bottom_high_kpa:          {min: 35.0, max: 50.0}
    front_windup_pressure_kpa: {min: 20.0, max: 40.0}
    front_extend_thrust_n:    {min: 5.0,  max: 8.0}
    front_extend_target_rad:  {min: 0.1745329, max: 0.5235988}
    front_place_bend_target_rad: {min: 1.0471976, max: 1.9198622}
    front_place_pressure_kpa: {min: 30.0, max: 50.0}
    rear_reverse_thrust_n:    {min: 0.2,  max: 1.4}
    recovery_tilt_target_rad: {min: 0.00872665, max: 0.0349066}
    phase_timeout_sec:        {min: 10.0, max: 18.0}
    thrust_ramp_n_s:          {min: 4.0,  max: 10.0}
    front_lower_rate_n_s:     {min: 0.6, max: 2.5}

  seed_candidate:
    base_pressure_kpa: 30.0
    rear_release_kpa: 0.0
    bottom_high_kpa: 50.0
    front_windup_pressure_kpa: 30.0
    front_extend_thrust_n: 6.0
    front_extend_target_rad: 0.3490659
    front_place_bend_target_rad: 1.5707963
    front_place_pressure_kpa: 40.0
    # The v12 smoke test showed only 0.00--0.15 deg at 0.6 N, below the
    # 0.5-deg rear-contact transition. Start the optimizer near the measured
    # reverse-motor authority while retaining the full search interval above.
    rear_reverse_thrust_n: 1.4
    recovery_tilt_target_rad: 0.00872665
    phase_timeout_sec: 10.0
    thrust_ramp_n_s: 6.0
    front_lower_rate_n_s: 1.5

  domain_randomization:
    arm_radius_m:                 {min: 0.040, max: 0.055}
    grip_friction_coefficient:    {min: 0.8,   max: 1.5}
    grip_force_per_pressure:      {min: 0.065, max: 0.095}
    bottom_force_per_pressure:    {min: 0.09,  max: 0.15}
    supply_rate:                  {min: 20.0,  max: 30.0}
    exhaust_rate:                 {min: 14.0,  max: 22.0}
    bottom_supply_rate:           {min: 80.0,  max: 120.0}
    bottom_exhaust_rate:          {min: 60.0,  max: 100.0}

  reward:
    progress: 2000.0
    lateral: 0.0
    vertical: 0.0
    # Tilt remains protected by rocking_max_tilt_rad in the state machine;
    # it is intentionally not penalized inside that safe envelope.
    max_tilt: 0.0
    detached_fraction: 50.0
    slip_excess: 5.0
    pump_effort: 0.002
    timeout: 50.0
