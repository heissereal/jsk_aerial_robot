control_rate_hz: 50.0
hybrid_locomotion_outer_enabled: true
hybrid_locomotion_initial_bottom_kpa: 30.0
# One continuous slip probe, then at most one lift probe per operator task.
hybrid_slip_probe_sec: 20.0 # pressure-ready search time; 0.25 N/s reaches the 5-N ceiling, wall cap is 3x
# Slip is accepted only when BOTH conditions hold: at least 2-mm net travel
# and at least 1.5-mm/s measured motion for a leaky accumulated 0.3 s. This is
# looser than the old 5-mm/s for a full 3-s rear cycle, but stationary mocap
# noise cannot pass the independent net-displacement condition.
hybrid_slip_confirm_sec: 0.3
hybrid_slip_min_progress_m: 0.002
hybrid_slip_min_speed_m_s: 0.0015
hybrid_slip_min_thrust_n: 0.75 # exclude bottom/rear-pressure settling before deliberate rotor sliding
# Keep both roll-rate limits, but reject a one-sample impact/IMU spike. The
# soft brake no longer declares SlipProbe failed; it only pauses its ramp.
hybrid_soft_roll_confirm_sec: 0.10
hybrid_roll_rate_confirm_sec: 0.10
hybrid_lift_probe_sec: 20.0  # long absolute-bend reach; rate FB normally finishes earlier
hybrid_front_vent_timeout_sec: 30.0
hybrid_front_vent_tolerance_kpa: 5.0  # target remains exactly zero
hybrid_lift_tilt_target_rad: 0.05235987755982989  # 3 deg, with actual arm extension
hybrid_pull_sec: 4.0
hybrid_front_catch_tolerance_rad: 0.06981317007977318 # 4 deg; real contact settled 2.3--2.7 deg from its pre-lift bend
hybrid_front_catch_stall_confirm_sec: 0.5 # accept object-limited contact without reproducing the free-space start angle
hybrid_front_catch_stall_rate_rad_s: 0.06
hybrid_front_catch_safe_margin_rad: 0.017453292519943295 # remain at least 1 deg inside the active bend floor
hybrid_front_catch_pressure_tolerance_kpa: 3.0 # both fronts must be within 3 kPa of the 40-kPa catch target
hybrid_front_catch_roll_rate_rad_s: 0.08
hybrid_front_catch_roll_prediction_tolerance_rad: 0.017453292519943295 # no predicted outward roll growth above 1 deg
hybrid_pull_progress_threshold_m: 0.002 # completed/regripped stroke must retain at least 2 mm
hybrid_pull_adaptation_step_n: 0.5      # next stroke: horizontal pull only; lift force is unchanged
hybrid_pull_adaptation_max_n: 6.0       # pair-level horizontal request; per-rotor 6-N guard still wins
hybrid_slip_seed_pull_max_n: 3.0        # failed static-slip endpoint is not copied as a 5-N pressure-assisted pull
# The configured 20-mm nominal stride conditions the first short goal; a
# comparable retained measurement replaces it online. Breakaway thrust is
# unchanged; motion 2 uses a shorter reach and motion 3 tapers its common
# impulse while pressure regrips.
hybrid_goal_scale_min: 0.25
# Repeat the proven full stroke until only a genuinely short final correction
# remains. With a nominal 20-mm stride, 16--17 mm remaining should take one
# full stroke (minimum cycle count), not shrink early into repeated 1-mm steps.
hybrid_goal_conditioning_start_ratio: 0.55
hybrid_goal_progress_max_scale: 1.5 # computed target ratio cap, never a fixed multiplier
hybrid_goal_preferred_stride_m: 0.010 # tile long goals around a repeatable 10-mm stride
hybrid_goal_extension_min_scale: 0.55
hybrid_goal_pull_taper_fraction: 0.15
hybrid_front_regrip_timeout_sec: 8.0
hybrid_rear_release_sec: 2.0
hybrid_rear_grasp_sec: 1.0
hybrid_rear_low_kpa: 0.0
hybrid_rear_vent_lead_margin_sec: 0.10 # motion 2 predicts rear exhaust so measured pressure is low at motion 3
hybrid_rear_vent_start_margin_rad: 0.03490658503988659 # pre-vent only when BOTH front arms are within 2 deg
# Front target completion owns the handoff. Rear exhaust continues in motion3;
# it may delay the handoff only until 12 kPa or for at most 0.5 s.
hybrid_probe_extension_rad: 0.13962634015954636  # compatibility fallback; 8 deg is not normal motion-2 completion
# The first motion=2 is identification, not an Action-C pulse.  Its early
# extension is at 0 kPa.  On an adverse slope only, the late reach uses the
# bounded predictive prefill below instead of waiting until the target.
# Later motion=2 strokes return to each arm's identified absolute bend.
# The former 20-deg target over-extended the real arm, while 60 deg restricted
# the useful unloading motion too much. Use 45 deg, then let motion 3 provide
# the intended pressure-driven flexion.
hybrid_lift_identification_bend_rad: 0.7853981633974483        # 45 deg absolute bend target
hybrid_lift_identification_tolerance_rad: 0.03490658503988659  # measured per-arm reach ends at <=47 deg
hybrid_lift_identification_confirm_sec: 0.06 # both bounded per-arm reach latches must persist before motion 3
# Relative 8 deg is only an extension-onset/tracking qualification. A stall at
# any larger bend remains an incomplete test and increases the bounded thrust
# search; it is never accepted as the learned absolute target.
hybrid_lift_identification_extension_limit_rad: 1.3962634015954636 # independent 80-deg hard excursion guard
hybrid_lift_identification_sync_deadband_rad: 0.05235987755982989  # 3 deg
hybrid_lift_identification_sync_gain_n_rad: 10.0 # raise only the lagging arm; never drop the leading hold force
hybrid_lift_identification_sync_assist_max_n: 1.0 # keep synchronizing after both onsets without a 4--5 N runaway
hybrid_lift_identification_tracking_start_rad: 0.13962634015954636 # relative 8 deg detects onset only; never completes motion 2 by itself
hybrid_lift_identification_angle_kp_n_rad: 4.0 # absolute three-joint-sum bend feedback
hybrid_lift_identification_rate_kd_n_s_rad: 0.8 # reused-stroke absolute-angle hold damping
hybrid_lift_identification_tracking_rise_n_s: 4.0 # bounded lagging-arm catch-up without a second impulse
hybrid_lift_identification_rate_feedback_min_bend_rad: 0.7853981633974483 # rate shaping only at bend >=45 deg
hybrid_lift_identification_rate_filter_tau_sec: 0.25 # reject one-sample rotor-side IMU spikes
hybrid_lift_identification_rate_confirm_sec: 0.15 # confirm overspeed before holding the initial search ramp
hybrid_lift_identification_rate_deadband_rad_s: 0.03490658503988659 # +/-2 deg/s about the 11.5-deg/s target
hybrid_lift_identification_rate_control_gain_n_rad: 1.5 # rate error [rad/s] -> thrust slew [N/s]
hybrid_lift_identification_rate_control_fall_n_s: 3.0 # smooth active braking; no one-sample thrust cut
hybrid_lift_identification_bend_rate_limit_rad_s: 6.0 # initial released test only; normal C remains pi rad/s
hybrid_lift_identification_return_bend_rate_limit_rad_s: 8.0 # intentional pressure-driven flexion after the unloading test
hybrid_lift_identification_return_pressure_slew_kpa_s: 30.0 # catch the first unloaded return before support is lost
hybrid_slip_probe_max_thrust_n: 5.0  # sliding identification only; lift/pull keep their separate 6 N cap
hybrid_slip_probe_max_pressure_kpa: 40.0 # arm pressure only; bottom remains capped at 30 kPa
hybrid_slip_probe_rise_n_s: 0.25 # slow common ramp; do not outrun pneumatic bend regulation
hybrid_slip_pressure_tracking_tolerance_kpa: 2.0 # freeze (do not cut) thrust ramp until both pressures catch up
hybrid_slip_extension_hold_margin_rad: 0.03490658503988659 # smoothly reduce rise over final 2 deg
hybrid_slip_hard_extension_margin_rad: 0.05235987755982989 # only >3-deg overrun permits safety reduction
hybrid_slip_extension_brake_fall_n_s: 0.5 # common soft brake; never the old 12-N/s one-arm chop
# Sliding diagnoses the current grasp; it is not the zero-pressure extension
# test.  From asymmetric starts such as [95, 127] deg, approach at most 10 deg
# per arm and retain at least base_pressure-10 kPa. Larger release belongs to
# motion 2 after an ineffective sliding result.
hybrid_slip_max_extension_rad: 0.17453292519943295
hybrid_slip_pressure_drop_max_kpa: 10.0
# First pass searches slowly to identify breakaway. From the second motion 2,
# use the former Action-C pulse rise while angle/rate/roll guards stay active.
hybrid_lift_search_rate_n_s: 0.7
hybrid_reused_lift_rise_n_s: 8.0
# Keep the Action-C-like fast rise, then brake over the final four measured
# degrees. This absorbs breakaway/rear-exhaust lag without lowering the 8-deg
# motion-2 target or weakening the independent bend-floor guard.
hybrid_reused_lift_brake_margin_rad: 0.06981317007977318
hybrid_reused_lift_hold_pressure_max_kpa: 10.0 # normal motion 2: delay-compensated terminal brake and reached-arm hold
hybrid_reused_lift_pressure_start_ratio: 0.90 # keep reused reach free; pressure brakes only the final 10%
hybrid_lift_approach_rate_n_s: 2.0
hybrid_lift_onset_margin_n: 0.6
hybrid_lift_onset_angle_rad: 0.017453292519943295
hybrid_lift_onset_rate_rad_s: 0.02
hybrid_lift_onset_confirm_sec: 0.10
hybrid_lift_extension_rate_rad_s: 0.20
# Adverse-slope reach/pull overlap.  The front chambers remain at exactly zero
# during early extension.  Near the predicted reach, a small monotonic prefill
# bends the arm while thrust is retained, rotating force from vertical toward
# horizontal before reverse travel accumulates.
hybrid_lift_overlap_pitch_start_rad: 0.08726646259971647 # 5 deg adverse pitch
hybrid_lift_overlap_pressure_start_ratio: 0.55
hybrid_lift_overlap_handoff_ratio: 0.60 # measured farthest reach before 3-kPa pilot pressure reverses the arm
hybrid_lift_overlap_min_reach_ratio: 0.50 # allow measured pressure-driven reversal after both arms pass this reach
hybrid_lift_overlap_prefill_kpa: 3.0 # pilot pressure only; full flexion pressure starts in motion 3
hybrid_lift_overlap_min_measured_kpa: 2.0
hybrid_lift_overlap_max_prediction_sec: 0.60
hybrid_lift_overlap_max_prediction_lead_ratio: 0.12 # reject breakaway-rate spikes that would prefill too early
hybrid_lift_overlap_min_up_scale: 0.65 # only after prefill starts; early lift remains unchanged
hybrid_locomotion_initial_m: 1.0
hybrid_locomotion_horizon_sec: 2.0
hybrid_locomotion_budget_ms: 12.0
hybrid_locomotion_target_speed_m_s: 0.005
# Per-front-rotor search target. Increase only after a powered 0.5-s window
# whose mean signed speed is below target. Prediction/slew/6-N guards win.
hybrid_locomotion_search_initial_thrust_n: 1.0
hybrid_locomotion_search_thrust_step_n: 0.5
hybrid_locomotion_search_interval_sec: 0.5
hybrid_locomotion_stroke_m: 0.020
# Maximum vertical-to-horizontal transfer time, NOT a powered-run stop timer.
# Drive continues to the absolute goal unless prediction/measured guards stop it.
hybrid_locomotion_run_max_sec: 3.0
hybrid_locomotion_up_force_max_n: 6.0  # also capped at 60% of configured body weight
imu_timeout_sec: 0.10
thrust_timeout_sec: 0.20

# GRASP -> PREPARE -> THRUST_CORRECTION -> RECOVER
state_machine_enabled: true
# Ignore pitch in recovery start/finish, motion detection and moment allocation
# (including gravity compensation). Applies before/after Action C as well.
# Pulse-relative tilt safety guards remain enabled; this is not a safety bypass.
correction_roll_only: true
correction_pair_reverse_spinal_mapping: false  # current -roll uses motors 0+1 in both hardware and MuJoCo
# Action C only: exhaust selected arms + bottom while ramping a synchronous
# correcting pair. No pressure-zero prerequisite or timed correction pulse.
# A/B/D and explicit fixed-arm tests retain their original recovery path.
action_c_continuous_recovery_enabled: true
# Continuous C recovery ONLY: restoring moment / measured geometry + rate PI.
# NO full-gravity FF: unknown contact reactions already support the body.
# Overspeed always reduces commanded thrust, regardless of model FF or I.
# Spinal Euler roll rate includes p,q,r coupling; pitch itself is NOT a target.
# The configured 0.50 N/s value below caps the sole PI integrator, not an
# additional constant ramp. Breakaway thrust is logged, never held forever.
recovery_angle_gain_s_inv: 0.65 # reduce only the final approach rate; far-error rate cap is unchanged
recovery_max_thrust_n: 5.0 # continuous Action-C posture recovery only; locomotion remains independently capped
recovery_target_rate_rad_s: 0.12 # slightly slower than the overshooting 0.14-rad/s real-arm trial
recovery_rate_kp_n_s_rad: 3.0   # avoid reacting to each short gyro spike
recovery_rate_ki_n_rad: 4.0
recovery_integral_slew_n_s: 0.5 # reach the measured breakaway thrust sooner after a real stall
recovery_thrust_rise_n_s: 2.0
recovery_thrust_fall_n_s: 3.0   # avoid unloading the extended pair as an impulse
recovery_settle_rate_rad_s: 0.20
recovery_settle_sec: 0.08       # catch/regrip in one pass once actually inside +/-3 deg
recovery_stop_margin_rad: 0.017453292519943295 # 1 deg tolerance around the 3-deg target
recovery_model_min_lever_m: 0.015  # summed pair moment / each rotor's thrust
recovery_model_fallback_thrust_n: 0.5 # invalid geometry: conservative FF + rate PI
recovery_rotor_cant_rad: 0.11344640137963143  # 6.5 deg, matches URDF
# Delay-aligned local response learning, separately for each correction pair.
# No learning while pressure/bend change; at least 3 accepted windows to use it.
recovery_response_delay_sec: 0.20
recovery_response_learning_enabled: true
recovery_response_window_sec: 0.40
recovery_stable_pressure_kpa: 1.0
recovery_stable_bend_rad: 0.035
# Pressure is the slow actuator. Preserve the immediate exhaust target without
# a measured-zero prerequisite. The selected pair remains at or below this
# pressure for the ENTIRE active recovery; speed/prediction braking changes
# rotor thrust only. Full 30-kPa grasp is restored after the +/-3-deg low-rate
# dwell succeeds, or during an explicit timeout/fault handoff.
recovery_release_pressure_kpa: 0.0
recovery_pressure_down_rate_kpa_s: 0.5
# On progress timeout, start grasp immediately and slew thrust down at the
# configured fall rate before declaring the timeout. This avoids arm rebound
# from an instantaneous motor cut. The selected rotor pair is never swapped.
# A non-converged pass regrips and retries; explicit stop, stale/invalid
# sensors, hard pressure faults, or 90-deg roll still terminate the task.
action_c_recovery_no_progress_timeout_sec: 30.0
# Renew progress when first/last quarter-window mean roll error drops by
# correction_progress_epsilon_rad (0.5 deg), even above the initial error.
# The independent prepare_timeout_sec (60 s) is never renewed by progress.
recovery_progress_window_sec: 1.0
# Five-scenario, two-knot predictive recovery. SHADOW ONLY by default:
# candidate logging/adaptation does not alter the existing actuator commands.
# Explicitly set shadow=false after prediction validation on a supported rig.
recovery_predictive_enabled: true
recovery_predictive_shadow: true
recovery_predictive_adapt: true  # bounded local corrections, cleared each recovery
recovery_predictive_period_sec: 0.10
recovery_predictive_horizon_sec: 2.0
recovery_predictive_budget_ms: 8.0 # return best fully evaluated candidate on deadline
recovery_predictive_pressure_tau_sec: 0.6  # initial hypothesis, NOT identified
recovery_predictive_bend_tau_sec: 0.35     # initial hypothesis, NOT identified
recovery_predictive_moment_gain: 8.0       # local acceleration/Nm hypothesis
recovery_predictive_thrust_step_n: 0.6     # first-move trust bound; 4 N cap unchanged
recovery_predictive_pressure_step_kpa: 2.0
# Initial real-machine motion test: pressurize arm 1 only, then drive motor 0
# through pwm_test. Disable this after confirming the state sequence.
fixed_arm_test_enabled: false
fixed_test_arm_index: 0
fixed_test_pressure_kpa: 40.0
fixed_test_thrust_n: 2.0
use_pwm_test_for_correction: true
# The current real-arm IMU/model comparison has an approximately 1.8 rad
# mounting-frame offset. Keep IMU freshness monitoring, but use pressure
# arrival for PREPARE until that transform is calibrated.
require_arm_geometry_for_prepare: false
neuron_slave_ids: [1, 2, 3, 4]
neuron_timeout_sec: 0.10
neuron_acc_lpf_tau_sec: 0.20
pressure_safety_limit_kpa: 60.0
pressure_safety_confirm_sec: 0.08  # reject isolated pressure-sensor spikes
# Ignore short roll excursions. Shared recovery and Action C both require
# >8 deg continuously for 0.30 s; active correction stops inside 5 deg.
# Gyro and pulse-relative tilt safety stops do NOT wait for this timer.
correction_trigger_angle_rad: 0.13962634015954636  # 8 deg
correction_stop_angle_rad: 0.08726646259971647     # 5 deg
correction_trigger_confirm_sec: 0.30
correction_max_angular_rate_rad_s: 0.8
correction_thrust_duration_sec: 0.20
correction_planning_thrust_n: 2.0
# A lower command is too close to ESC idle to start the real rotor reliably.
correction_min_thrust_n: 2.0
# Per-rotor recovery ceiling (separate from the 5 N locomotion pulse ceiling).
# The pwm_test path is streamed; do not assume a firmware pulse timer here.
correction_max_thrust_n: 4.0
# Once Spinal confirms whole-body correction, captured breakaway thrust is
# held outside the slowdown band. Near the target it may taper almost to idle.
correction_hold_min_thrust_n: 0.3
# Do not interpret pressure-release motion, residual Action-C motion, or IMU
# noise as a rotor-driven correction stroke before useful thrust is present.
correction_motion_detection_min_thrust_n: 0.5
correction_motion_start_rate_rad_s: 0.05
# Reject a brief attitude twitch caused by arm extension. The Spinal gyro
# must remain in the correction direction and roll error must actually fall
# by at least 1 deg over this confirmation window.
correction_motion_confirm_sec: 0.15
correction_motion_min_error_reduction_rad: 0.0174533  # 1 deg
# This threshold now detects a temporary pause only. Once breakaway is
# detected, the captured thrust remains latched instead of starting a new
# search; it is tapered by attitude error inside the slowdown band below.
correction_motion_stop_rate_rad_s: 0.02
correction_motion_stop_timeout_sec: 0.30
# Begin reducing thrust at 10 deg. Predict roll 0.20 s ahead from the Spinal
# gyro so rotor/body inertia is removed before crossing the target. The high
# down-rate permits a prompt cut at the 5-deg stop band; the angle schedule,
# rather than this rate limit, keeps the approach gradual.
correction_slowdown_angle_rad: 0.1745329  # 10 deg
correction_prediction_horizon_sec: 0.20
# Continuous C adds current thrust / down-rate to this prediction so braking
# accounts for command rundown; legacy recovery uses the fixed horizon.
# After confirmed motion, consider the correction stalled when roll improves
# by less than 0.5 deg for 0.5 s and the Spinal roll rate is nearly zero.
# Raise the captured hold thrust gently, never beyond the 4-N recovery limit.
# Continuous C: this is the rate PI integral's maximum change (N/s).
# Accumulate from signed rate error, including before breakaway, with amplitude
# and slew anti-windup. No extra stall ramp is added. Prediction retains I;
# actual finish/fault/reset clears it. Speed braking always overrides I.
# The 0.5-s stall gate below remains diagnostic for C / active for legacy.
# Legacy recovery aborts after 5 s; continuous C uses the timeout above.
correction_progress_epsilon_rad: 0.00872665  # 0.5 deg
correction_stall_timeout_sec: 0.50
correction_stall_thrust_ramp_n_s: 0.30
correction_stall_abort_timeout_sec: 5.0
correction_thrust_down_rate_n_s: 6.0
# With a 5 kPa/s target slew, traversing the full measured range from the
# 10 kPa grasp pressure takes up to 8 s, before the stability dwell begins.
# Arm 2 currently exhausts much more slowly than the other chambers. Keep the
# paired posture-correction gate synchronous, but allow up to 60 s for both
# selected chambers to reach their target before abandoning the correction.
prepare_timeout_sec: 60.0
prepare_stable_duration_sec: 0.30
# The straightening target grows with required moment. It is also increased as
# needed to bring a rotor below the 80 deg tilt boundary. Maximum change is the
# grasp-model bend itself (a straight arm), not a fixed angle.
prepare_angle_per_moment_rad_per_nm: 1.0
prepare_min_straighten_angle_rad: 0.0174533  # 1 deg
# Do not request the physically unreachable 60--70 deg changes seen in the
# pitch experiment. Pressure/thrust shaping is limited to 15 deg per cycle.
prepare_max_straighten_angle_rad: 0.2617994  # 15 deg
prepare_max_rotor_tilt_rad: 1.3962634        # 80 deg
prepare_angle_tolerance_rad: 0.00872665  # 0.5 deg
# Reduce pressure gradually first. Thrust remains zero until both the target
# pressure and measured pressure reach the floor. Only the remaining angle
# error is produced by increasing rotor thrust from zero.
prepare_pressure_ramp_rate_kpa_s: 10.0
# No fixed positive lower bound: PREPARE may exhaust to atmospheric pressure
# when that is required by the moment-dependent straight-arm target.
minimum_prepare_pressure_kpa: 0.0
prepare_initial_thrust_n: 0.0
prepare_thrust_ramp_rate_n_s: 1.5
prepare_max_thrust_n: 9.0
pwm_test_max_thrust_n: 11.2
pwm_test_max_reverse_thrust_n: 4.4
pwm_test_min_pwm: 0.5
pwm_test_neutral_pwm: 0.75
pwm_test_max_pwm: 0.975
pwm_test_voltage: 21.2
pwm_test_reference_voltage: 21.2
# MotorInfo_3D_V has positive thrust below neutral. These are its 21.2 V
# low-PWM positive and high-PWM negative branches, respectively.
pwm_test_positive_thrust_below_neutral: true
pwm_test_forward_polynomial: [65.0663776343, -14.931187117, 0.083500613]
pwm_test_reverse_polynomial: [-15.9407056717, 5.310953554, -0.043050962]
# If the pair straightens by less than 1 deg for 0.5 s, accept that shape as
# the object-dependent limit and reallocate the correction impulse from it.
prepare_progress_epsilon_rad: 0.0174533
prepare_progress_timeout_sec: 0.5
recover_timeout_sec: 5.0
cooldown_duration_sec: 1.0
pressure_tolerance_kpa: 2.0
# Initial tolerance for the pressure/thrust lookup model versus Neuron IMU.
# Tighten this after measuring the real arm's repeatability.
arm_angle_tolerance_rad: 0.30
arm_gyro_tolerance_rad_s: 0.20

# Attitude PD output is a required moment about the human-arm contact point.
# These are deliberately small initial gains for low-thrust experiments.
roll_moment_kp_nm_per_rad: 0.10
pitch_moment_kp_nm_per_rad: 0.10
roll_moment_kd_nm_per_rad_s: 0.015
pitch_moment_kd_nm_per_rad_s: 0.015

# Legacy/other allocator only: (CoM - contact) x m*g.
# Continuous Action-C recovery intentionally ignores this flag/term.
gravity_compensation: true
mass_kg: 1.244
center_of_mass_main_body_m: [-0.00348932, 0.00065510, 0.01200916]
# Must be measured for the actual perching/contact condition.
contact_position_main_body_m: [0.0, 0.0, -0.070]

base_pressure_kpa: 30.0
# Keep correction pressure within the 40 kPa range used for the first
# real-machine attitude-correction tests.
maximum_pressure_kpa: 40.0
pressure_rate_limit_kpa_s: 10.0

# joint_model.cpp uses max(0, base_thrust) + 1.8 N as the thrust coordinate of the
# measured P/T table. Keep that convention until the table is recalibrated.
bend_model_thrust_offset_n: 1.8

# hugmy2.urdf.xacro rotor declaration order, mapped to zero-based motor index:
# motor0/rotor1=(+x,+y), motor1/rotor2=(-x,+y),
# motor2/rotor3=(-x,-y), motor3/rotor4=(+x,-y).
arm_base_positions_main_body_m: [ 0.03812,  0.03812, -0.039,
                                 -0.03812,  0.03812, -0.039,
                                 -0.03812, -0.03812, -0.039,
                                  0.03812, -0.03812, -0.039]
arm_yaw_rad: [-2.3561944902, -0.7853981634, 0.7853981634, 2.3561944902]

# Damped least-squares pressure allocation. It minimizes the roll/pitch moment
# error using r_i(P_i) x (T_i*d_i(P_i)), with one-direction pressure bounds.
allocation_iterations: 6
allocation_damping: 1.0e-5
allocation_step_limit_kpa: 5.0
allocation_pressure_epsilon_kpa: 0.25
allocation_bias_weight: 0.01

# The Neuron IMU is approximately 0.05 m below its rotor. Reserved for the
# future per-arm quaternion-based rotor pose estimator.
neuron_z_offset_from_rotor_m: -0.05

# One open-loop/visual-feedback inchworm step. Publish a Vector3Stamped to
# ~inchworm_command: vector.x/y is the travel direction in main_body and
# vector.z is the total requested mocap displacement [m]. The controller
# repeats short regripping strokes until that total is reached.
# Action C accepts longitudinal [+1, 0] and [-1, 0]. It uses arms 0/3 for +x
# and arms 1/2 for -x, and evaluates progress with signed raw mocap x.
inchworm_front_release_kpa: 5.0
inchworm_swing_pressure_kpa: 0.0
inchworm_transfer_pressure_kpa: 20.0
inchworm_rear_unload_kpa: 8.0
# During PULL the rear pair is reduced to this absolute pressure so it can
# slide while the front pair remains anchored.
inchworm_pull_pressure_kpa: 5.0
# Front pressure is applied to both new contacts while their extension-hold
# thrust is removed together. Keep this at the normal human-contact grasp
# pressure initially.
inchworm_front_pull_pressure_kpa: 30.0
inchworm_reach_thrust_n: 2.0
inchworm_reach_max_thrust_n: 6.0
inchworm_reach_angle_kp_n_rad: 45.0
inchworm_reach_min_pressure_kpa: 10.0
inchworm_reach_pressure_ramp_kpa_s: 5.0
inchworm_min_usable_reach_angle_rad: 0.0349066  # 2 deg
inchworm_rear_lift_thrust_n: 3.0
inchworm_rear_lift_max_thrust_n: 7.0
# Disabled after the physical test showed that this phase moved backwards.
inchworm_rear_reverse_thrust_n: 0.0
inchworm_thrust_ramp_n_s: 1.0
inchworm_default_distance_m: 0.002
inchworm_stroke_distance_m: 0.002
inchworm_min_cycle_progress_m: 0.0002
inchworm_max_cycles: 10
inchworm_reach_angle_rad: 0.0872665  # 5 deg, or the duration limit below
# Treat the swing arm as sufficiently extended once its bend is at most 20 deg
# from straight. This is an absolute bend threshold, not a change from GRASP.
inchworm_target_bend_angle_rad: 0.3490659  # 20 deg
# Ignore isolated gyro/vibration spikes; only a sustained limit violation is
# treated as an unsafe body rotation during FRONT_REACH.
inchworm_angular_rate_fault_delay_sec: 0.20
# The real OptiTrack stream in walk_c_new_1 contained isolated 0.31/0.51-s
# gaps while IMU, Neuron and pressure telemetry stayed current.  Stop on a
# sustained loss, but do not abort an entire gait on one such tracking gap.
inchworm_mocap_timeout_sec: 0.60
# Leave false on the real machine. The optimization launch enables it because
# the MuJoCo attitude estimator intentionally freezes IMU attitude on contact.
# Keep posture recovery in the Spinal body roll/pitch convention. Mocap is
# still used for locomotion displacement, but not for correction-pair signs.
use_mocap_attitude_for_inchworm: false
# Arm 3 exhaust is slower on the current pneumatic hardware. FRONT_RELEASE
# keeps all rotor thrust at zero, so allow the measured pressure more time to
# settle before declaring a fault.
inchworm_release_timeout_sec: 30.0
inchworm_reach_duration_sec: 10.0
# After reaching the near-straight angle, raise the arm pressure and lower its
# thrust immediately. Anchor after the arm bends back to the placement angle
# or MuJoCo reports a sufficiently small gap.
action_a_place_bend_target_rad: 1.5707963  # 90 deg
action_a_place_hold_sec: 0.0
action_a_place_thrust_down_rate_n_s: 1.5
# Stop the 4 N rear pull in about two seconds while rear pressure is restored
# and the bottom support is exhausted.
action_a_rear_thrust_down_rate_n_s: 2.0
action_a_place_timeout_sec: 15.0
# MuJoCo's pneumatic grip is effective inside 35 mm. Start pressurizing a
# little inside that boundary instead of overshooting the closest approach.
action_a_place_contact_gap_m: 0.030
action_a_place_min_bend_change_rad: 0.0872665  # 5 deg
# Body-tilt feedback for front-arm extension. Between 5 and 12 deg the
# permitted thrust falls linearly to zero. The ceiling never rises again in
# the same swing, avoiding reapplication of static-friction-level thrust after
# the body starts sliding. A 150 ms prediction reacts to increasing tilt.
action_a_tilt_soft_limit_rad: 0.0872665       # 5 deg
action_a_tilt_hard_limit_rad: 0.2094395       # 12 deg
action_a_tilt_prediction_horizon_sec: 0.15
action_a_tilt_thrust_down_rate_n_s: 3.0
# If tilt feedback has already reduced the safe thrust ceiling, accept a
# swing that reached at least 45 deg bend even when the ideal 20-deg target is
# unreachable. a2 reached 38 deg and +12 mm mocap x before timing out.
action_a_tilt_limited_bend_target_rad: 0.7853982  # 45 deg
# Yaw-assisted single-arm placement. For +x travel, arm 0 uses negative
# thrust on rotors 1+3 to turn -yaw, and arm 3 uses rotors 0+2 to turn +yaw.
# With a 70--100 mm lateral contact offset, 10 deg adds about 12--17 mm in +x.
# The yaw seen in the 2026-09-25 trial was applied manually, so that bag does
# not identify the rotor-to-yaw sign. Keep this legacy reverse-thrust assist
# disabled; the arm0+arm2 diagonal extension below is used instead.
action_a_yaw_assist_enabled: false
action_a_yaw_target_rad: 0.1745329             # 10 deg relative per swing
action_a_yaw_tolerance_rad: 0.0174533          # 1 deg
action_a_yaw_max_reverse_thrust_n: 0.6         # per assisting rotor
action_a_yaw_thrust_ramp_n_s: 0.3
action_a_yaw_thrust_down_rate_n_s: 1.5
action_a_yaw_kp_n_rad: 3.5
action_a_yaw_max_rate_rad_s: 0.3490659         # 20 deg/s
action_a_yaw_wrong_way_limit_rad: 0.0523599    # stop if 3 deg opposite
# Arm0 placement uses the opposite arm2 as a lightly driven diagonal helper.
# Both chambers are released together, but arm2 receives only a small positive
# extension thrust. This frees the body to yaw without the former large
# reverse-thrust pair. When arm0 starts to bend back, arm2 returns to the
# normal 30 kPa grasp and arm0 rises to 40 kPa to pull from its new contact.
action_a_diagonal_assist_enabled: true
action_a_diagonal_assist_thrust_n: 2.0  # measured minimum useful rotor thrust
action_a_diagonal_assist_thrust_ramp_n_s: 0.3
action_a_diagonal_assist_thrust_down_rate_n_s: 1.5
action_a_arm0_rebend_pressure_kpa: 40.0
# Bottom support is synchronized with each individual front-arm swing:
# inflate while thrust extends the arm, then exhaust as thrust is lowered and
# arm pressure rises for placement. It is inflated again during rear reverse
# thrust and exhausted when that thrust is lowered. The single central bladder
# stays within the requested 30 kPa.
action_a_bottom_enabled: true
action_a_bottom_low_kpa: 0.0
action_a_bottom_high_kpa: 30.0
inchworm_anchor_timeout_sec: 8.0
inchworm_pull_timeout_sec: 5.0
inchworm_settle_duration_sec: 0.5
inchworm_motion_start_speed_m_s: 0.001
inchworm_motion_stop_speed_m_s: 0.0002
inchworm_motion_stop_timeout_sec: 0.3
# Do not latch on a one-sample mocap velocity spike. Motion must produce this
# much new forward displacement, and a return beyond the second threshold
# immediately resumes the minimum-thrust search.
inchworm_progress_epsilon_m: 0.00025
inchworm_progress_regression_m: 0.00020

# Experimental two-arm locomotion primitive. Keep false for the existing
# one-arm Action A. Set true to run Action B for each requested stroke:
# front-pair unload/thrust -> 5-deg hold and three front pulses -> four-arm GRASP.
inchworm_action_b_enabled: false

# Action C: model-inverted 90-deg horizontal pull pulses. Action C takes
# priority over Action B when both switches are true.
inchworm_action_c_enabled: false

# Action D: pressure feedback acts only outside the 75--105 deg hold band.
# Bend angle is zero when straight and increases with flexion. A front arm
# starting above 120 deg is depressurized toward the 75--105 deg band without
# blocking the gait. Rapid extension means a decreasing angle; feedback stays
# active down to 60 deg and returns to GRASP only after crossing that edge.
# Once mocap detects forward motion, the current front/rear thrusts are held.
inchworm_action_d_enabled: false
action_d_target_angle_rad: 1.5707963       # 90 deg nominal
action_d_soft_min_angle_rad: 1.3089969      # 75 deg: pressure FB lower edge
action_d_soft_max_angle_rad: 1.8325957      # 105 deg: pressure FB upper edge
action_d_hard_min_angle_rad: 1.0471976     # 60 deg: straight/extension-side hard limit
action_d_hard_max_angle_rad: 2.0943951     # 120 deg: nominal flexion edge; initial excess is allowed
action_d_max_angle_rate_rad_s: 0.7853982   # 45 deg/s decreasing bend: abrupt extension
action_d_immediate_angle_rate_rad_s: 2.0943951 # 120 deg/s: stop immediately
action_d_angle_rate_confirm_sec: 0.10      # 45 deg/s must persist; reject one-sample IMU spikes
action_d_rear_extension_margin_rad: 0.1745329 # rear stop edge = RAMP-start bend - 10 deg
action_d_rear_rate_filter_alpha: 0.25      # low-pass rear Neuron bend-rate spikes
action_d_prediction_horizon_sec: 0.20
action_d_pressure_kp_kpa_rad: 20.0
action_d_pressure_rate_kpa_s: 10.0          # pressure must lead the slow thrust ramp
action_d_max_pressure_kpa: 50.0             # model covers 8 N up to 50 kPa
action_d_front_pressure_per_thrust_kpa_n: 2.5
action_d_front_pressure_lead_n: 2.0         # preload for thrust arriving 4 s later
action_d_rear_pressure_drop_per_thrust_kpa_n: 0.0
action_d_rear_min_pressure_kpa: 0.0          # safety floor; rear grasp pressure is retained
action_d_bottom_pressure_kpa: 30.0
# Pulsed static-friction search. Each pulse rises smoothly at 2 N/s, remains
# ON for 0.6 s, then falls rapidly so retained chamber pressure can bend the
# front arms during the 1.0-s OFF interval. Amplitude advances 1--6 N only
# after a complete ON/OFF cycle fails to move the body.
action_d_front_thrust_ramp_n_s: 2.0
action_d_rear_thrust_ramp_n_s: 1.0           # reaches half-front target at the same time
action_d_thrust_step_n: 1.0
action_d_pulse_on_sec: 0.6
action_d_pulse_off_sec: 1.0
action_d_thrust_down_rate_n_s: 20.0
action_d_max_front_thrust_n: 6.0
action_d_max_rear_thrust_n: 1.5            # initial safety cap: -0.25 N rear per +1 N front
action_d_motion_min_front_thrust_n: 0.5 # ignore mocap settling before thrust acts
action_d_motion_min_travel_m: 0.002     # require 2 mm forward displacement
action_d_motion_confirm_sec: 0.20       # and sustained forward speed
action_d_prepare_tolerance_rad: 0.0523599  # 3 deg
action_d_prepare_stable_sec: 0.50
action_d_prepare_timeout_sec: 30.0
action_d_ramp_timeout_sec: 30.0
# RAMP posture protection is referenced to the attitude after PREPARE. Start
# reducing thrust at 12 deg, resume below 8 deg, and enter controlled REGRIP
# at 20 deg or on a real angular-rate spike. In d_11, normal RAMP rate had a
# 0.10 rad/s 95th percentile and posture collapse reached 2.32 rad/s.
action_d_tilt_soft_limit_rad: 0.2094395    # 12 deg
action_d_tilt_resume_rad: 0.1396263        # 8 deg
action_d_max_tilt_rad: 0.3490659           # 20 deg
action_d_max_body_rate_rad_s: 0.8
action_d_posture_thrust_down_rate_n_s: 1.0

# Whole-body rocking locomotion, independent of Action A/B/C:
# four-arm grip -> bottom rearward-preload inflation -> pressure-made front
# wind-up -> front release/high-thrust SWING with immediate bottom exhaust ->
# front grip/rear release -> rear-only reverse
# thrust -> normal four-arm grasp.  Bottom is not a swing actuator: it creates
# the rearward bias before SWING and stays exhausted from SWING onward.
rocking_gait_enabled: false
rocking_bottom_low_kpa: 0.0
rocking_bottom_high_kpa: 50.0
rocking_front_release_kpa: 0.0
rocking_rear_release_kpa: 0.0
# State 20 makes the wind-up with pneumatic pressure while bottom preload is
# held. State 21 releases the front chamber while keeping bottom inflated,
# applies model-scale forward thrust, and starts bottom exhaust only after both
# front arms reach the configured near-straight angle. It then slowly returns
# to a new cylinder contact and fully regrips.
rocking_front_windup_pressure_kpa: 30.0
rocking_front_extend_thrust_n: 6.0
rocking_front_windup_target_rad: 2.0943951       # 120 deg
rocking_front_extend_target_rad: 0.3490659       # 20 deg; bottom exhaust trigger (0 deg is exactly straight)
rocking_front_place_bend_target_rad: 1.5707963   # 90 deg fallback on hardware
rocking_front_place_pressure_kpa: 40.0
rocking_front_min_advance_m: 0.003
rocking_front_angle_tolerance_rad: 0.2617994     # 15 deg; pair asymmetry is measured independently
rocking_rear_reverse_thrust_n: 0.8
# MuJoCo maps 50 kPa to 15 deg.  The transition uses 90% of the target so
# settling error cannot make the pressure-derived posture unreachable.
rocking_front_tilt_target_rad: 0.2356194       # 13.5 deg
rocking_recovery_tilt_target_rad: 0.00872665   # 0.5 deg
rocking_phase_timeout_sec: 10.0
rocking_thrust_ramp_n_s: 6.0
rocking_front_windup_hold_sec: 0.20
rocking_front_extend_hold_sec: 0.05
rocking_front_lower_rate_n_s: 1.5
rocking_land_settle_sec: 0.4
rocking_max_tilt_rad: 0.5235988                # 30 deg
action_c_rear_release_max_kpa: 8.0      # measured rear pressure, not just command=0
action_c_rear_release_hold_kpa: 10.0    # after acquisition, retain release through ripple
action_c_rear_release_hard_kpa: 12.0    # above this stops immediately (no grace)
action_c_rear_release_grace_sec: 0.10   # bounded excursion above hold, NOT sensor-fault grace
action_c_abort_reverse_travel_m: 0.03   # large retreat remains a hard stop
# Action C uses predictive locomotion only; see doc/hybrid_locomotion.md.
# Relative gyro integration is anchored by the settled rotor/Neuron bend.
# Per-arm predictive commands may differ; shared posture recovery is separate.
action_c_max_thrust_n: 6.0  # locomotion only; recovery remains capped at 4 N
action_c_extension_target_rad: 0.13962634015954636  # 8-deg allowance used by the frozen bend floor
action_c_max_extension_rad: 0.3490658503988659      # cut if either extends 20 deg
action_c_max_extension_mismatch_rad: 0.2617993877991494  # maximum relative extension mismatch: 15 deg
action_c_hard_min_bend_rad: 0.5235987755982988     # absolute pulse floor 30 deg; hardware validation required
action_c_start_extension_margin_rad: 0.03490658503988659  # 2 deg beyond requested extension
# Ordinary recovery is evaluated at settled phase boundaries, not mid-motion.
# Hard roll/rate limits remain immediate during motion.
# Per-arm floor: max(30, min(55, ON-start bend - target extension - 2)) deg.
# Relative extension, rate and mismatch guards remain active.
action_c_min_safe_angle_rad: 0.9599310885968813     # nominal pulse floor, NOT the start gate
action_c_extension_rate_limit_rad_s: 3.141592653589793  # cut above 180 deg/s extension
action_c_pre_roll_rate_tolerance_rad_s: 0.17453292519943295  # 10 deg/s
action_c_prepare_timeout_sec: 20.0
action_c_posture_recovery_trigger_rad: 0.17453292519943295 # 10 deg
# Above 10 deg, ordinary recovery requires worsening |roll| AND outward gyro.
# Stable/improving offsets below the hard limit can continue (either sign).
action_c_roll_trend_window_sec: 0.5
action_c_roll_trend_growth_rad: 0.017453292519943295  # >=1 deg growth over window
action_c_roll_trend_rate_rad_s: 0.017453292519943295  # >=1 deg/s outward
action_c_posture_hard_roll_rad: 0.2617993877991494  # 15 deg regardless of trend
# Count residual roll only at PREPARE/SETTLE, after measured arm/bottom
# pressures and roll rate have settled continuously for this interval.
# No pulse/recoil/inflation history is carried into the 0.3-s confirmation.
# Predictive locomotion holds the selected bottom pressure within each trial.
# Recovery commands 0 kPa in parallel; normal resume does NOT wait for zero.
action_c_posture_settle_sec: 0.5
action_c_bottom_deflation_tolerance_kpa: 5.0  # recovery: target 0 +/-5 kPa only
# Recovery/normal phase boundaries only; raw safety checks remain unchanged.
# Acquire at normal +/-2 kPa, retain within +/-5.
# Larger deviations up to +/-8 are tolerated for <=0.10 s, never on acquisition.
action_c_pressure_hold_tolerance_kpa: 5.0
action_c_pressure_dropout_sec: 0.10
action_c_pressure_max_deviation_kpa: 8.0
# Active C correction target; a settled 3--10 deg rebound after normal regrasp may
# resume locomotion without another correction. Confirmation time is shared
# with correction_trigger_confirm_sec above, not applied to the rate guard.
# Progress-timeout waiting instead requires +/-3 deg, <=0.05 rad/s for 1 s.
action_c_posture_resume_rad: 0.05235987755982989           # 3 deg (continuous C success)
action_c_posture_rate_trigger_rad_s: 0.8
action_c_emergency_stop_roll_rad: 1.5707963267948966 # 90 deg: autonomous retry stops here
action_c_max_posture_recoveries: 5 # legacy diagnostic only; hybrid C retries until goal/stop/90 deg
# The front pair ramps slowly until the minimum measurable lift is reached.
action_b_front_duration_sec: 20.0
# Front-pair thrust rise rate used only in ACTION_B_FRONT_REACH.
action_b_front_thrust_ramp_up_n_s: 0.3
# Maximum common thrust used while preserving the 0-kPa lift vertical force.
action_b_shape_target_thrust_n: 8.0
action_b_prediction_horizon_sec: 0.25
# Legacy upper reference retained for compatibility.
action_b_front_transition_tilt_rad: 0.0872665
# Initial lift guide (5 deg). The later shaping phase may continue up to the
# independent 30-deg safety bound in the controller.
action_b_min_lift_tilt_rad: 0.08726646259971647
# Hold the body at 5 deg, then superimpose three thrust pulses.
action_b_hold_tilt_tolerance_rad: 0.00872665  # +/- 0.5 deg
action_b_hold_thrust_up_rate_n_s: 3.0
action_b_hold_thrust_down_rate_n_s: 20.0
action_b_hold_tilt_kp_n_rad: 8.0
action_b_hold_tilt_ki_n_rad_s: 12.0
action_b_hold_stable_duration_sec: 0.3
action_b_shape_max_pressure_kpa: 30.0
action_b_shape_pressure_rate_kpa_s: 5.0
# Maximum duration for the monotonic 0 -> 30 kPa shape ramp.
action_b_shape_search_timeout_sec: 60.0
action_b_shape_settle_timeout_sec: 15.0
action_b_max_thrust_n: 9.0
action_b_pre_pulse_max_thrust_n: 8.0
action_b_pulse_amplitude_n: 1.0
action_b_pulse_on_duration_sec: 1.25
action_b_pulse_off_duration_sec: 0.50
action_b_pulse_repetitions: 3
# Neuron angle feedback added to the model-inverted pressure during a pulse.
action_b_pulse_angle_pressure_gain_kpa_rad: 30.0
# Includes the pressure/angle ramp, endpoint settling, and all pulse intervals.
# Keep margin for pneumatic delay.
action_b_front_regrip_timeout_sec: 100.0
action_b_thrust_ramp_n_s: 3.0
