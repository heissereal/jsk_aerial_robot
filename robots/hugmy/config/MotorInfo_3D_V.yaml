motor_info:
  # Bidirectional ESC command range. PWM=0.75 is the zero-thrust command.
  min_pwm: 0.5
  neutral_pwm: 0.75
  max_pwm: 0.975
  bidirectional: true
  # This ESC/motor combination has the opposite polarity from the previous
  # MotorInfo_3D model: commands below neutral generate positive thrust.
  positive_thrust_below_neutral: true
  min_thrust: -4.478729282
  force_landing_thrust: 1.0

  # The stored coefficients describe F(PWM), so the controller uses the
  # quadratic inverse (SQRT_MODE) to obtain PWM from target thrust.
  pwm_conversion_mode: 0
  m_f_rate: 0.0135
  vel_ref_num: 5

