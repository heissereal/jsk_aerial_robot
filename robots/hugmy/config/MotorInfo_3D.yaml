motor_info:
  # Bidirectional ESC command range. PWM=0.75 is the zero-thrust command.
  min_pwm: 0.5
  neutral_pwm: 0.75
  max_pwm: 0.975
  bidirectional: true
  min_thrust: -0.2
  force_landing_thrust: 1.0

  # The stored coefficients describe F(PWM), so the controller uses the
  # quadratic inverse (SQRT_MODE) to obtain PWM from target thrust.
  pwm_conversion_mode: 0
  m_f_rate: 0.0279
  vel_ref_num: 5

  simulation:
    use_pwm_model: true
    voltage: 21.2
    neutral_deadband: 0.001

