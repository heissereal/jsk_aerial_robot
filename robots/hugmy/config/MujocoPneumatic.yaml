simulation:
  pneumatic:
    pressure_rate: 100.0
    sensor_rate: 100.0
    supply_rate: 25.0
    exhaust_rate: 18.0
    # The bottom chamber is driven separately in the real mechanism and must
    # establish a posture bias before the rotor pulse.  Keep arm-pneumatic
    # timing unchanged, but make bottom inflation/deflation substantially
    # faster in simulation.
    bottom_supply_rate: 100.0
    bottom_exhaust_rate: 80.0
    maximum_pressure: 60.0
    initial_pressure: 0.0
    leak_rate: 0.0
    bag_stiffness: 1.0
    structural_stiffness: 0.01
    # MuJoCo integrates this as native joint damping.  The Gazebo value 0.05
    # was an explicit effort gain and is too stiff for the light carrier links.
    bag_damping: 0.005
    thrust_offset: 1.8
    command_timeout: 0.25
    pressure_noise: 0.05
    imu_acceleration_noise: 0.017
    imu_gyro_noise: 0.0002
    grip_range: 0.035
    grip_stiffness: 180.0
    grip_damping: 2.0
    grip_force_per_pressure: 0.08
    # The pressure controller settles within about 1 kPa of a zero target.
    # Treat that residual as an open chamber instead of a permanent 0.08 N
    # virtual attachment.
    # Same measured boundary used by action_c_rear_release_max_kpa.  Pressure
    # below it changes arm shape but does not retain an old axial contact.
    grip_min_pressure: 8.0
    grip_friction_coefficient: 1.2
    grip_tangential_damping: 4.0
    # Elastic shear supplies static friction; capped by mu * normal_force.
    # Set 0 for a legacy viscous-only comparison. Not a fixed-body constraint.
    grip_tangential_stiffness: 180.0  # N/m, provisional contact compliance
    grip_marker_scale: 0.025
    grip_marker_rate: 30.0
    # AIST Japanese anthropometric database 1991--92, young-adult male mean.
    # The fixture is a tapered elliptic forearm aligned with local x: elbow at
    # -x, wrist at +x.  Breadth is local y and depth is local z.  The legacy
    # radius is retained only for loading an old cylinder MJCF.
    human_arm_half_length: 0.1258
    human_arm_proximal_width: 0.0926
    human_arm_proximal_depth: 0.07175
    human_arm_distal_width: 0.0599
    human_arm_distal_depth: 0.0464
    human_arm_radius: 0.05
    # Main-body origin above the cylinder top BEFORE settling. Applied only
    # with spawn_human=true; 0 preserves the MJCF free-flight spawn height.
    # The plugin computes the local surface height from the tapered ellipse,
    # then adds this clearance and the common robot/forearm height offset.
    perching_initial_clearance: 0.065
    human_arm_roll: 0.0
    human_arm_pitch: 0.0
    human_arm_yaw: 0.0
    thrust_scale: 1.0
    maximum_reverse_thrust: 6.0

    # Disabled for normal bringup. The Gym launch enables this gate so every
    # policy action advances one 0.1 s MuJoCo interval in headless mode.
    gym_step_mode: false
    gym_step_duration: 0.1
    # Gym launch overrides this to 2 ms. Normal simulations retain the
    # mujoco_ros_control default (1 ms).
    gym_physics_timestep: 0.0

    # One hardware-compatible chamber is centred under the body.  Its rounded
    # support supplies normal load while remaining neutral to fore/aft rocking;
    # arm pressure/contact and rotor thrust determine the rocking direction.
    # The old one-sided virtual tilt is disabled because a single central
    # chamber cannot command a signed pitch torque.
    bottom_force_per_pressure: 0.12  # N/kPa
    bottom_lever_arm: 0.0            # centred in main_body x/y
    bottom_point_z: -0.050           # m in main_body
    bottom_contact_range: 0.080      # m from the artificial forearm
    # Finite-width pressure patch for the single central bladder. The total
    # force remains bottom_force_per_pressure * pressure; only its lateral
    # distribution changes, reproducing passive roll support on an ellipse.
    bottom_contact_half_width: 0.030 # m, centre to each lateral patch
    # Passive roll support of the finite bladder contact on the flat side of
    # the tapered ellipse. It scales to zero with bottom pressure and does not
    # add commanded pitch or translational force.
    bottom_roll_support_enabled: true
    bottom_roll_support_reference_pressure: 30.0 # kPa
    bottom_roll_support_stiffness: 1.2            # N m/rad at reference pressure
    bottom_roll_support_damping: 0.12             # N m s/rad
    bottom_roll_support_max_torque: 0.35           # N m
    bottom_visual_base_height: 0.003
    bottom_visual_height_per_pressure: 0.00025
    bottom_virtual_tilt_enabled: false
    bottom_tilt_reference_pressure: 50.0
    bottom_tilt_at_reference: 0.2617994  # 15 deg at 50 kPa
    bottom_tilt_stiffness: 50.0          # N m/rad
    bottom_tilt_damping: 3.0            # N m s/rad
    bottom_tilt_max_torque: 5.0         # N m
    # While nearly exhausted, follow the settled body orientation and use it
    # as the zero-angle reference for the next inflation.
    bottom_tilt_reference_reset_pressure: 0.5
